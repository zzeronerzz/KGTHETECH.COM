<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KG The Tech - Cybersecurity tools and hardware. Under construction.">
    <title>KG The Tech | Under Construction</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 6px;
            color: #00ff41;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
            margin-bottom: 0.5rem;
        }
        .tagline {
            font-size: 0.9rem;
            color: #666;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 3rem;
        }
        .status {
            font-size: 1.1rem;
            color: #ff6600;
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .message {
            font-size: 0.85rem;
            color: #555;
            line-height: 1.8;
            margin-bottom: 3rem;
        }
        .bar {
            width: 300px;
            height: 2px;
            background: #1a1a1a;
            margin: 2rem auto;
            position: relative;
            overflow: hidden;
        }
        .bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #00ff41, transparent);
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        .footer {
            font-size: 0.7rem;
            color: #333;
            letter-spacing: 2px;
        }
        .footer a {
            color: #444;
            text-decoration: none;
        }
        .grid {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(0,255,65,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,65,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="grid"></div>
    <div class="container">
        <div class="logo">KG THE TECH</div>
        <div class="tagline">Hacking on a Budget</div>
        <div class="bar"></div>
        <div class="status">// UNDER CONSTRUCTION</div>
        <div class="message">
            Rebuilding from the ground up.<br>
            Cybersecurity tools. Hardware. Knowledge.<br>
            Coming back better.
        </div>
        <div class="bar"></div>
        <div class="footer">
            KGTheTech LLC &mdash; Aurora, CO
        </div>
    </div>
</body>
</html>
